<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlayStation 5</title>

    <link rel="stylesheet" href="style/headerps5.css">
    <link rel="stylesheet" href="style/herops5.css">
    <link rel="stylesheet" href="style/interactions.css">
    <script src="playstation5.js" defer></script>
</head>

<body>
   <header class="header">
    <!-- 1. Sony Top Bar -->
    <div class="sony-bar">
        <div class="sony-logo">
            <img
                class="sony-img"
                src="ps5 image/sony.png"
                alt="Sony Logo"
            >
        </div>
    </div>


    <!-- 2. Main PlayStation Navigation -->
    <nav class="main-nav">

        <div class="main-nav-left">

            <!-- PlayStation Logo -->
            <div class="playstation-logo">
                <img
                    class="playstation-img"
                    src="ps5 image/PlayStation-Icon-Logo.wine.svg"
                    alt="PlayStation Logo"
                >
            </div>


            <!-- Main Navigation Links -->
            <div class="nav-links">
                <a class="nav-link" href="#">Store</a>
                <a class="nav-item" href="#">PS5</a>
                <a class="nav-item" href="#">Games</a>
                <a class="nav-item" href="#">PS Plus</a>
                <a class="nav-item" href="#">Accessories</a>
                <a class="nav-item" href="#">News</a>
                <a class="nav-item" href="#">Support</a>
            </div>
            <!-- sign in button -->
        </div>


        <!-- 3. PS5 Navigation -->
        <div class="ps5-navigation">

            <!-- PS5 Logo -->
            <div class="ps5-logo">
                <img
                    class="ps5-img"
                    src="ps5 image/playstation-5-logo-png_seeklogo-366986.png"
                    alt="PlayStation 5 Logo"
                >
            </div>


            <!-- PS5 Navigation Links -->
            <div class="ps5-links">
                <a class="ps5-link" href="#">PlayStation®5</a>
                <a class="ps5-link" href="#">PlayStation®5 Pro</a>
                <a class="ps5-link" href="#">Games</a>
                <a class="ps5-link" href="#">Accessories</a>
                <a class="ps5-link" href="#">More features</a>
                <a class="ps5-link" href="#">Entertainment</a>
            </div>


            <!-- Buy Button -->
            <button class="buy-button">
                Buy now
            </button>

        </div>

    </nav>
</header>
 
<!-- 4. Hero Section -->
<section class="hero">

    <img
        class="hero-img"
        src="ps5 image/ps5_wallpaper.jpg"
        alt="PlayStation 5"
    >

    <div class="hero-content">

        <h1>PlayStation 5</h1>

        <h2>Play Has No Limits</h2>

        <p>
            Experience the power of PlayStation 5.
        </p>

        <button class="hero-button">
            buy now
        </button>

        <button class="play-button">
            watch trailer
        </button>

    </div>

</section>
  
</body>

</html>
